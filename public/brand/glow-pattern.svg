<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0075f2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#26ffe6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0075f2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#26ffe6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0075f2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#26ffe6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="blur2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="#111117" />

  <!-- soft distant glow orbs -->
  <circle cx="220" cy="180" r="140" fill="#0075f2" opacity="0.08" filter="url(#blur2)" />
  <circle cx="1380" cy="340" r="170" fill="#26ffe6" opacity="0.06" filter="url(#blur2)" />
  <circle cx="700" cy="980" r="200" fill="#0075f2" opacity="0.07" filter="url(#blur2)" />
  <circle cx="1450" cy="1050" r="130" fill="#26ffe6" opacity="0.06" filter="url(#blur2)" />

  <!-- flowing wave lines -->
  <path d="M -50,150 C 250,60 450,260 750,150 S 1250,40 1650,180"
        fill="none" stroke="url(#g1)" stroke-width="2.5" filter="url(#blur1)" />
  <path d="M -50,420 C 300,520 500,320 850,430 S 1350,540 1650,410"
        fill="none" stroke="url(#g2)" stroke-width="2" filter="url(#blur1)" />
  <path d="M -50,700 C 260,600 520,800 800,690 S 1300,580 1650,720"
        fill="none" stroke="url(#g1)" stroke-width="2.5" filter="url(#blur1)" />
  <path d="M -50,960 C 300,1050 560,880 880,970 S 1360,1080 1650,940"
        fill="none" stroke="url(#g2)" stroke-width="2" filter="url(#blur1)" />
  <path d="M -50,1150 C 280,1080 540,1220 820,1120 S 1320,1010 1650,1160"
        fill="none" stroke="url(#g1)" stroke-width="2" filter="url(#blur1)" />
</svg>
